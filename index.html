<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUUP.</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070707;
      font-family: 'Archivo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 0px;
      margin-bottom: 30px;
      object-fit: contain;
    }
    .tagline {
      font-family: 'Archivo Black', sans-serif;
      font-size: 18px;
      color: #f9f9f7;
      margin-bottom: 100px;
      text-align: center;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 95%;
      padding: 18px 24px;
      border-radius: 15px;
      text-decoration: none;
      background: transparent;
      border: 2px solid;
      margin-bottom: 18px;
      transition: opacity 0.15s;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { opacity: 0.75; }
    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-label {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #f9f9f7;
      flex: 1;
    }
    .btn-arrow { font-size: 24px; }
    .btn-appstore  { border-color: #f7e5bc; }
    .btn-appstore  .btn-icon  { background: rgba(247,229,188,0.1); }
    .btn-appstore  .btn-arrow { color: #f7e5bc; }
    .btn-playstore { border-color: #9c4dff; }
    .btn-playstore .btn-icon  { background: rgba(156,77,255,0.1); }
    .btn-playstore .btn-arrow { color: #9c4dff; }
    .btn-instagram { border-color: #ff5a5f; }
    .btn-instagram .btn-icon  { background: rgba(255,90,95,0.1); }
    .btn-instagram .btn-arrow { color: #ff5a5f; }
    .btn-tiktok    { border-color: #bfff00; }
    .btn-tiktok    .btn-icon  { background: rgba(191,255,0,0.1); }
    .btn-tiktok    .btn-arrow { color: #bfff00; }
  </style>
  <!-- Google Analytics (cookieless) -->

</head>

    <p class="tagline">Feeling lost is optional</p>
